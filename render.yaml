services:
  # ── 기존 서비스 (server.js / hrx.html) ──────────────────────
  - type: web
    name: hrroom
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # ── 신규 서비스 (HR Live Next.js 앱) ────────────────────────
  - type: web
    name: hr-live
    runtime: node
    buildCommand: npm install && npx next build
    startCommand: npx next start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL_CLASSIFIER
        value: claude-sonnet-4-20250514
      - key: CLAUDE_MODEL_DEBATE
        value: claude-sonnet-4-20250514
      - key: CLAUDE_MODEL_SUMMARY
        value: claude-sonnet-4-20250514
      - key: APP_MOCK_MODE
        value: "false"
      - key: NODE_ENV
        value: production
