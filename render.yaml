services:
  # hrroom — Node.js static server (server.js)
  - type: web
    name: hr-room
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false

  # hr-live — Next.js HR 토킹클럽
  - type: web
    name: hr-live
    runtime: node
    buildCommand: npm install && npx next build
    startCommand: npx next start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL_CLASSIFIER
        value: claude-sonnet-4-20250514
      - key: CLAUDE_MODEL_DEBATE
        value: claude-sonnet-4-20250514
      - key: CLAUDE_MODEL_SUMMARY
        value: claude-sonnet-4-20250514
      - key: APP_MOCK_MODE
        value: "false"
      - key: NODE_ENV
        value: production
