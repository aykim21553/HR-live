<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학자금 관리자 인박스</title>
<style>
  :root {
    --blue:#1F4E79;--blue-mid:#2E75B6;--blue-light:#DEEBF7;--blue-pale:#EBF3FF;
    --green-badge:#1a7a3c;--green-light:#E2EFDA;
    --amber-badge:#b45309;--amber-light:#FFF2CC;
    --orange:#843C0C;--orange-light:#FCE4D6;
    --red-badge:#991b1b;--red-light:#FFDDE0;
    --gray:#595959;--gray-light:#F5F5F5;--border:#D9D9D9;--text:#1F1F1F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;color:var(--text);background:#F0F2F5;}

  .topbar{background:var(--blue);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{font-size:16px;font-weight:600;}
  .topbar .meta{font-size:12px;opacity:.8;display:flex;align-items:center;gap:12px;}
  .api-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
  .api-live{background:#1a7a3c;color:#fff;}
  .api-demo{background:#b45309;color:#fff;}

  .page{max-width:1280px;margin:0 auto;padding:20px 16px;display:grid;gap:16px;}

  /* 통계 카드 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .stat-card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px 18px;display:flex;flex-direction:column;gap:4px;}
  .stat-card .num{font-size:28px;font-weight:700;}
  .stat-card .lbl{font-size:12px;color:var(--gray);}
  .stat-card.urgent .num{color:var(--orange);}
  .stat-card.warn .num{color:var(--amber-badge);}
  .stat-card.ok .num{color:var(--green-badge);}
  .stat-card.total .num{color:var(--blue-mid);}

  /* 필터 바 */
  .filter-bar{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .filter-bar label{font-size:12px;color:var(--gray);margin-right:4px;}
  .filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
  .tab-group{display:flex;gap:4px;margin-right:8px;}
  .tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--gray);transition:.15s;}
  .tab.active{border-color:var(--blue-mid);background:var(--blue-pale);color:var(--blue-mid);}
  .tab:hover:not(.active){background:var(--gray-light);}
  .btn-search{padding:7px 18px;background:var(--blue-mid);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-refresh{padding:7px 14px;background:var(--gray-light);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-refresh:hover{background:var(--blue-pale);}

  /* 테이블 */
  .table-wrap{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead tr{background:var(--blue-pale);}
  th{padding:10px 12px;text-align:left;font-weight:700;color:var(--blue);font-size:12px;white-space:nowrap;border-bottom:1.5px solid var(--border);}
  td{padding:10px 12px;border-bottom:1px solid var(--gray-light);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.data-row:hover td{background:#FAFBFC;cursor:pointer;}

  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
  .bg-green{background:var(--green-light);color:var(--green-badge);}
  .bg-amber{background:var(--amber-light);color:var(--amber-badge);}
  .bg-orange{background:var(--orange-light);color:var(--orange);}
  .bg-red{background:var(--red-light);color:var(--red-badge);}
  .bg-gray{background:var(--gray-light);color:var(--gray);}

  .flag-chip{display:inline-block;background:var(--orange-light);color:var(--orange);font-size:10px;padding:1px 6px;border-radius:8px;margin:1px;font-weight:600;}
  .warn-icon{font-size:12px;color:var(--orange);margin-left:4px;}

  .amt-payable{color:var(--blue-mid);font-weight:700;}
  .amt-diff{font-size:11px;color:var(--red-badge);}
  .hist-chip{font-size:11px;color:var(--gray);background:var(--gray-light);padding:1px 6px;border-radius:6px;white-space:nowrap;}

  .empty{text-align:center;padding:48px;color:var(--gray);font-size:14px;}
  .loading{text-align:center;padding:48px;color:var(--blue-mid);font-size:14px;}

  /* 페이지네이션 */
  .pagination{display:flex;justify-content:center;gap:6px;padding:14px;}
  .pg-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .pg-btn.active{background:var(--blue-mid);color:#fff;border-color:var(--blue-mid);}

  /* 액션 버튼 그룹 */
  .action-bar{background:#fff;border-radius:10px;border:1px solid var(--border);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .btn-action{padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid;display:flex;align-items:center;gap:6px;transition:.15s;}
  .btn-dl{background:#fff;color:var(--green-badge);border-color:rgba(26,122,60,0.3);}
  .btn-dl:hover{background:var(--green-light);}
  .btn-draft{background:#fff;color:var(--blue-mid);border-color:rgba(46,117,182,0.3);}
  .btn-draft:hover{background:var(--blue-light);}
  .btn-draft:disabled{opacity:.4;cursor:not-allowed;}

  /* 일괄 기안문 모달 */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
  .modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .modal-header h2{font-size:15px;font-weight:700;color:var(--text);}
  .modal-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--gray-light);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--gray);}
  .modal-body{padding:16px 20px;overflow-y:auto;flex:1;}
  .modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}
  .draft-item{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .draft-item-header{padding:10px 14px;background:var(--blue-pale);display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:600;color:var(--blue);}
  .draft-item-body{padding:14px;background:#fafafa;font-size:11px;line-height:1.75;white-space:pre-wrap;font-family:'Malgun Gothic',sans-serif;color:#333;display:none;max-height:300px;overflow-y:auto;}
  .draft-item-body.open{display:block;}
  .draft-progress{text-align:center;padding:32px;color:var(--blue-mid);font-size:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px;">
    <a id="dashboard-link" href="/"
       style="color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.25);transition:.15s;"
       onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background=''"
       title="HR Room 대시보드로 돌아가기">← Dashboard</a>
    <h1>학자금 관리자 인박스</h1>
  </div>
  <span class="meta">
    <span id="date-label">로딩 중...</span>
    <span id="api-badge" class="api-badge api-demo">DEMO</span>

</div>

<div class="page">

  <!-- 통계 카드 -->
  <div class="stats">
    <div class="stat-card urgent">

    </div>
    <div class="stat-card ok">
      <div class="num" id="cnt-auto">—</div>
      <div class="lbl">자동승인후보 — 검토 후 승인</div>
    </div>
    <div class="stat-card total">
      <div class="num" id="cnt-total">—</div>
      <div class="lbl">전체 처리 대기</div>
    </div>
  </div>

  <!-- 필터 바 -->
  <div class="filter-bar">
    <div class="tab-group">
      <div class="tab active" onclick="filterTab(this,'all')">전체</div>
      <div class="tab" onclick="filterTab(this,'수기검토필요')">수기검토필요</div>
      <div class="tab" onclick="filterTab(this,'보완필요')">보완필요</div>
      <div class="tab" onclick="filterTab(this,'자동승인후보')">자동승인후보</div>
      <div class="tab" onclick="filterTab(this,'반려')">반려</div>
    </div>
    <label>학교급</label>
    <select id="school-filter" onchange="applyFilters()">
      <option value="">전체</option>
      <option value="유치원">유치원</option>
      <option value="고등학교">고등학교</option>
      <option value="대학교">대학교</option>
    </select>
    <label>신청일</label>
    <input type="date" id="date-from" onchange="applyFilters()">
    <span style="color:var(--gray);font-size:12px;">~</span>
    <input type="date" id="date-to" onchange="applyFilters()">
    <button class="btn-search" onclick="applyFilters()">조회</button>
    <button class="btn-refresh" onclick="loadData()">↻ 새로고침</button>
  </div>

  <!-- 액션 버튼 바 -->
  <div class="action-bar">
    <span style="font-size:12px;font-weight:600;color:var(--gray)">일괄 처리</span>
    <button class="btn-action btn-dl" onclick="downloadCSV()" title="현재 필터된 목록 전체를 CSV로 저장">
      📥 목록 CSV 다운로드
    </button>
    <button class="btn-action btn-draft" id="batch-draft-btn" onclick="openBatchDraft()" title="자동승인후보 건에 대한 기안문 일괄 생성">
      📄 자동승인후보 기안문 일괄 생성
    </button>
    <a class="btn-action btn-draft" href="uploads.html" style="text-decoration:none" title="OCR 업로드된 모든 첨부파일을 한눈에 보고 미리보기·다운로드">
      📂 첨부파일 보관함
    </a>
    <span id="batch-draft-count" style="font-size:11px;color:var(--gray)"></span>
  </div>

  <!-- 신청 목록 테이블 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>신청일</th>
          <th>신청자</th>
          <th>자녀명</th>
          <th>학교급</th>
          <th>수혜기간</th>
          <th>신청금액</th>
          <th>지급가능금액</th>
          <th>자동판정</th>
          <th>주요 플래그</th>
          <th>누적이력</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="11" class="loading">데이터 로딩 중...</td></tr>
      </tbody>
    </table>
    <div class="pagination" id="pagination"></div>
  </div>

</div>

<!-- ── 일괄 기안문 모달 ─────────────────────────────────── -->
<div class="modal-overlay" id="batch-modal" onclick="if(event.target===this)closeBatchModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h2>📄 자동승인후보 기안문 일괄 생성</h2>
      <button class="modal-close" onclick="closeBatchModal()">✕</button>
    </div>
    <div class="modal-body" id="batch-modal-body">
      <div class="draft-progress">기안문을 생성하고 있습니다…</div>
    </div>
    <div class="modal-footer">
      <button class="btn-action btn-dl" id="download-all-btn" onclick="downloadAllDrafts()" style="display:none">
        ⬇ 전체 기안문 TXT 다운로드
      </button>
      <button class="btn-action btn-draft" onclick="closeBatchModal()">닫기</button>
    </div>
  </div>
</div>

<script>
// ─── 폴백 샘플 데이터 (API 연결 실패 시) ──────────────────────────────────
const SAMPLE = [
  {id:"APP-042",employee_id:"EMP003",applied_at:"2026-04-05T09:00:00",employee_name:"김철수",child_name:"김연우",child_id:"CHILD_HASH_001",school_type:"유치원",benefit_term:"2025-3분기",amount_requested:280000,amount_payable:280000,rule_status:"자동승인후보",flags:[],status:"evaluated",terms_used:2,terms_remaining:10,duplicate_suspected:false,limit_exhausted:false},
  {id:"APP-041",employee_id:"EMP002",applied_at:"2026-04-04T14:30:00",employee_name:"이영희",child_name:"이민준",child_id:"CHILD_H002",school_type:"고등학교",benefit_term:"2025-3분기",amount_requested:1200000,amount_payable:1000000,rule_status:"자동승인후보",flags:["한도초과_200000원"],status:"evaluated",terms_used:3,terms_remaining:9,duplicate_suspected:false,limit_exhausted:false},
  {id:"APP-040",employee_id:"EMP015",applied_at:"2026-04-04T11:20:00",employee_name:"박지훈",child_name:"박서연",child_id:"CHILD_H003",school_type:"대학교",benefit_term:"2025-2학기",amount_requested:3200000,amount_payable:0,rule_status:"보완필요",flags:["서류불일치"],status:"analyzed",terms_used:4,terms_remaining:4,duplicate_suspected:false,limit_exhausted:false},
  {id:"APP-039",employee_id:"EMP020",applied_at:"2026-04-03T16:00:00",employee_name:"최민수",child_name:"최준혁",child_id:"CHILD_H004",school_type:"유치원",benefit_term:"2025-3분기",amount_requested:300000,amount_payable:0,rule_status:"수기검토필요",flags:["중복의심_2025-3분기"],status:"evaluated",terms_used:5,terms_remaining:7,duplicate_suspected:true,limit_exhausted:false},
  {id:"APP-038",employee_id:"EMP010",applied_at:"2026-04-03T10:45:00",employee_name:"정유진",child_name:"정하은",child_id:"CHILD_HASH_003",school_type:"대학교",benefit_term:"2025-2학기",amount_requested:3200000,amount_payable:0,rule_status:"반려",flags:["한도소진"],status:"evaluated",terms_used:8,terms_remaining:0,duplicate_suspected:false,limit_exhausted:true},
  {id:"APP-037",employee_id:"EMP008",applied_at:"2026-04-02T09:30:00",employee_name:"강동원",child_name:"강지우",child_id:"CHILD_H005",school_type:"고등학교",benefit_term:"2025-3분기",amount_requested:850000,amount_payable:850000,rule_status:"자동승인후보",flags:[],status:"evaluated",terms_used:1,terms_remaining:11,duplicate_suspected:false,limit_exhausted:false},
  {id:"APP-036",employee_id:"EMP022",applied_at:"2026-04-02T08:10:00",employee_name:"윤서준",child_name:"윤채원",child_id:"CHILD_H006",school_type:"유치원",benefit_term:"2025-3분기",amount_requested:280000,amount_payable:0,rule_status:"보완필요",flags:["납부일_미확인"],status:"analyzed",terms_used:0,terms_remaining:12,duplicate_suspected:false,limit_exhausted:false},
  {id:"APP-035",employee_id:"EMP017",applied_at:"2026-04-01T15:00:00",employee_name:"임현우",child_name:"임지호",child_id:"CHILD_H007",school_type:"대학교",benefit_term:"2025-2학기",amount_requested:3150000,amount_payable:3150000,rule_status:"자동승인후보",flags:[],status:"evaluated",terms_used:2,terms_remaining:6,duplicate_suspected:false,limit_exhausted:false},
  {id:"APP-034",employee_id:"EMP028",applied_at:"2026-04-01T11:00:00",employee_name:"한수진",child_name:"한예린",child_id:"CHILD_H008",school_type:"유치원",benefit_term:"2025-3분기",amount_requested:350000,amount_payable:300000,rule_status:"자동승인후보",flags:["한도초과_50000원"],status:"evaluated",terms_used:3,terms_remaining:9,duplicate_suspected:false,limit_exhausted:false},
  {id:"APP-033",employee_id:"EMP041",applied_at:"2026-03-31T13:20:00",employee_name:"오민준",child_name:"오시우",child_id:"CHILD_H009",school_type:"고등학교",benefit_term:"2025-3분기",amount_requested:980000,amount_payable:0,rule_status:"수기검토필요",flags:["서류식별불가"],status:"analyzed",terms_used:6,terms_remaining:6,duplicate_suspected:false,limit_exhausted:false},
];

let allData = [];
let currentFilter = "all";
let isLive = false;

// 신규 API (applications.json 기반) + 기존 Azure Functions API 순서로 시도
const _INBOX_ORIG = (location.hostname==='127.0.0.1'||location.hostname==='localhost') ? 'http://127.0.0.1:8765' : '';
const NEW_API  = _INBOX_ORIG + '/api/tuition/admin/applications';
const API_BASE = _INBOX_ORIG + '/api';

// applications.json 데이터를 inbox 행 형식으로 변환
function appToRow(a) {
  const ocr = a.ocr || {};
  const cr  = a.cross_ref || {};
  const termStr = ocr.benefit_year
    ? (ocr.benefit_year + '년 ' + (ocr.benefit_term || ''))
    : (cr.benefit_term || a.benefit_term || '—');
  return {
    id:              a.id,
    employee_id:     a.employee_id,
    applied_at:      a.submitted_at || a.applied_at,
    employee_name:   a.employee_name || cr.employee_name || a.employee_id || '—',
    child_name:      ocr.child_name || cr.child_registered?.name || a.child_name || '—',
    school_type:     ocr.school_type || a.school_type || '—',
    school_country:  ocr.school_country || 'KR',
    benefit_term:    termStr,
    amount_requested: ocr.amount_total || a.amount_requested || 0,
    amount_payable:  cr.amount_payable ?? a.amount_payable ?? 0,
    rule_status:     cr.verdict || a.rule_status || '수기검토필요',
    flags:           cr.flags || a.flags || [],
    status:          a.status || 'pending',
    terms_used:      cr.terms_used_ytd ?? a.terms_used ?? 0,
    terms_remaining: cr.terms_remaining ?? a.terms_remaining ?? 0,
    duplicate_suspected: cr.duplicate || a.duplicate_suspected || false,
    limit_exhausted: (cr.terms_remaining === 0) || a.limit_exhausted || false,
    // OCR 원문 보존 (admin_review 이동 시 참조)
    _has_ocr: !!(ocr.child_name || ocr.school_name),
  };
}

// ─── API 데이터 로드 ──────────────────────────────────────────────────────────
async function loadData() {
  // 기존 DEMO 배너 모두 제거 (새로고침 시 중복 방지)
  document.querySelectorAll('.demo-banner').forEach(b => b.remove());

  // Render 서버 웜업 안내 메시지 (최초 연결 시 최대 30초 소요)
  document.getElementById("tbody").innerHTML =
    `<tr><td colspan="11" class="loading">서버 연결 중… (첫 접속 시 최대 30초 소요, 잠시 기다려 주세요)</td></tr>`;

  // ① 신규 엔드포인트 (applications.json) — 타임아웃 25초 (Render 웜업 대기)
  try {
    const res = await fetch(NEW_API, { signal: AbortSignal.timeout(25000) });
    if (res.ok) {
      const json = await res.json();
      allData = (Array.isArray(json) ? json : []).map(appToRow);
      isLive = true;
      document.getElementById("api-badge").textContent = "LIVE";
      document.getElementById("api-badge").className = "api-badge api-live";
      const today = new Date().toISOString().slice(0,10);
      const monthAgo = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
      document.getElementById("date-from").value = monthAgo;
      document.getElementById("date-to").value = today;
      document.getElementById("date-label").textContent = `${today} 기준`;
      updateStats(); applyFilters(); return;
    }
  } catch {}

  // ② 기존 Azure Functions API 시도 (5초)
  try {
    const res = await fetch(`${API_BASE}/tuition/admin/inbox`, { signal: AbortSignal.timeout(5000) });
    if (res.ok) {
      const json = await res.json();
      allData = json.items || [];
      isLive = true;
      document.getElementById("api-badge").textContent = "LIVE";
      document.getElementById("api-badge").className = "api-badge api-live";
    } else { throw new Error(); }
  } catch (e) {
    // 서버 미연결 → 샘플 데이터 표시 + 배너 1개만 추가
    allData = SAMPLE;
    isLive = false;
    document.getElementById("api-badge").textContent = "DEMO";
    document.getElementById("api-badge").className = "api-badge api-demo";
    const banner = document.createElement('div');
    banner.className = 'demo-banner';
    banner.style.cssText = 'background:#FFF2CC;border:1px solid #b45309;border-radius:8px;padding:10px 16px;font-size:12px;color:#7a3c00;margin-bottom:12px;display:flex;align-items:center;gap:8px;';
    banner.innerHTML = '<b>⚠ DEMO 모드:</b>&nbsp;서버가 슬립 상태입니다. 잠시 후 <b>↻ 새로고침</b>을 누르면 실제 데이터가 표시됩니다.';
    document.querySelector('.page').prepend(banner);
  }

  const today = new Date().toISOString().slice(0,10);
  const monthAgo = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  document.getElementById("date-from").value = monthAgo;
  document.getElementById("date-to").value = today;
  document.getElementById("date-label").textContent = `${today} 기준`;

  updateStats();
  applyFilters();
}

// ─── 통계 카드 업데이트 ───────────────────────────────────────────────────────
function updateStats() {
  const cnt = (status) => allData.filter(r => r.rule_status === status).length;
  document.getElementById("cnt-manual").textContent = cnt("수기검토필요");
  document.getElementById("cnt-supplement").textContent = cnt("보완필요");
  document.getElementById("cnt-auto").textContent = cnt("자동승인후보");
  document.getElementById("cnt-total").textContent = allData.length;
  updateBatchCount();
}

// ─── 뱃지 스타일 ──────────────────────────────────────────────────────────────
function badgeClass(rule) {
  return {
    "자동승인후보": "bg-green", "보완필요": "bg-amber",
    "수기검토필요": "bg-orange", "반려": "bg-red"
  }[rule] || "bg-gray";
}

function fmtAmt(n) { return n > 0 ? n.toLocaleString() + "원" : "—"; }
function fmtDate(iso) { return iso ? iso.slice(0, 10) : "—"; }

// ─── 행 렌더링 ────────────────────────────────────────────────────────────────
function renderRows(data) {
  const tbody = document.getElementById("tbody");
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="11" class="empty">조회된 신청 건이 없습니다.</td></tr>`;
    updatePagination(0);
    return;
  }
  tbody.innerHTML = data.map(r => {
    const diff = r.amount_requested - r.amount_payable;
    const diffHtml = diff > 0 ? `<div class="amt-diff">-${diff.toLocaleString()}원 조정</div>` : "";
    const flagsHtml = (r.flags || []).map(f => `<span class="flag-chip">${f}</span>`).join("") || "—";
    const dupWarn = r.duplicate_suspected ? `<span class="warn-icon" title="중복의심">⚠</span>` : "";
    const limitWarn = r.limit_exhausted ? `<span class="warn-icon" title="한도소진">🚫</span>` : "";

    // 누적이력 표시
    let histHtml = "";
    if (r.terms_remaining !== undefined && r.terms_remaining !== null) {
      const pct = r.terms_used + r.terms_remaining > 0
        ? Math.round((r.terms_used / (r.terms_used + r.terms_remaining)) * 100) : 0;
      histHtml = `<span class="hist-chip">${r.terms_used}회/${r.terms_used + r.terms_remaining}회 (${pct}%)</span>`;
    }

    const url = `admin_review.html?id=${encodeURIComponent(r.id)}&emp=${encodeURIComponent(r.employee_id||'')}`;
    return `<tr class="data-row" style="cursor:pointer" onclick="location.href='${url}'">
      <td>${fmtDate(r.applied_at)}</td>
      <td>${r.employee_name}</td>
      <td>${r.child_name}${dupWarn}${limitWarn}</td>
      <td>${r.school_type}</td>
      <td>${r.benefit_term}</td>
      <td>${fmtAmt(r.amount_requested)}</td>
      <td><span class="amt-payable">${fmtAmt(r.amount_payable)}</span>${diffHtml}</td>
      <td><span class="badge ${badgeClass(r.rule_status)}">${r.rule_status}</span></td>
      <td>${flagsHtml}</td>
      <td>${histHtml}</td>
      <td style="display:flex;align-items:center;gap:4px">
        <span class="badge bg-gray">${r.status}</span>
        ${r._has_ocr ? '' : '<span title="OCR 미완료" style="font-size:10px;color:#f59e0b">⚠</span>'}
      </td>
    </tr>`;
  }).join("");

  updatePagination(data.length);
}

// ─── 페이지네이션 (심플) ──────────────────────────────────────────────────────
function updatePagination(total) {
  const pg = document.getElementById("pagination");
  if (total <= 20) { pg.innerHTML = ""; return; }
  pg.innerHTML = `<button class="pg-btn">‹</button><button class="pg-btn active">1</button><button class="pg-btn">›</button>`;
}

// ─── 필터 적용 ────────────────────────────────────────────────────────────────
function applyFilters() {
  const school = document.getElementById("school-filter").value;
  const dateFrom = document.getElementById("date-from").value;
  const dateTo = document.getElementById("date-to").value;

  let data = allData;
  if (currentFilter !== "all") data = data.filter(r => r.rule_status === currentFilter);
  if (school) data = data.filter(r => r.school_type === school);
  if (dateFrom) data = data.filter(r => fmtDate(r.applied_at) >= dateFrom);
  if (dateTo) data = data.filter(r => fmtDate(r.applied_at) <= dateTo);

  renderRows(data);
}

function filterTab(el, val) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  currentFilter = val;
  applyFilters();
}

// ─── CSV 다운로드 ────────────────────────────────────────────────────────────
function downloadCSV() {
  const school = document.getElementById("school-filter").value;
  const dateFrom = document.getElementById("date-from").value;
  const dateTo   = document.getElementById("date-to").value;
  let data = allData;
  if (currentFilter !== "all") data = data.filter(r => r.rule_status === currentFilter);
  if (school)    data = data.filter(r => r.school_type === school);
  if (dateFrom)  data = data.filter(r => fmtDate(r.applied_at) >= dateFrom);
  if (dateTo)    data = data.filter(r => fmtDate(r.applied_at) <= dateTo);

  if (!data.length) { alert("다운로드할 데이터가 없습니다."); return; }

  const headers = ["신청번호","신청일","신청자","사번","자녀명","학교급","수혜기간","신청금액(원)","지급가능금액(원)","자동판정","주요플래그","누적사용횟수","잔여횟수","상태"];
  const rows = data.map(r => [
    r.id, fmtDate(r.applied_at), r.employee_name, r.employee_id||"",
    r.child_name, r.school_type, r.benefit_term,
    r.amount_requested, r.amount_payable, r.rule_status,
    (r.flags||[]).join(" | "), r.terms_used??"", r.terms_remaining??"", r.status
  ].map(v => `"${String(v??"").replace(/"/g,'""')}"`).join(","));

  const csv = "\uFEFF" + [headers.join(","), ...rows].join("\r\n");
  const label = currentFilter === "all" ? "전체" : currentFilter;
  const fname = `학자금신청목록_${label}_${new Date().toISOString().slice(0,10)}.csv`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = fname;
  a.click();
}

// ─── 일괄 기안문 생성 ────────────────────────────────────────────────────────
let batchDrafts = [];

function _buildDraftLocal(r) {
  const today = new Date().toLocaleDateString("ko-KR");
  const flags = r.flags || [];
  const fNote = flags.length ? "\n   ※ 특이사항: " + flags.join(", ") : "";
  return `              학 자 금 지 급 신 청 기 안

─────────────────────────────────────────────────────
수    신 : 혁신지원실장
기 안 일 : ${today}
기 안 자 : ${r.employee_name} (${r.employee_id||""})
결 재 선 : 팀장 → 본부장  (학자금 지원 규정 제12조)
─────────────────────────────────────────────────────

1. 신청 개요
   ▸ 신청번호 : ${r.id}
   ▸ 수혜자   : ${r.child_name} (${r.school_type})
   ▸ 수혜기간 : ${r.benefit_term}

2. 납부 내역
   ▸ 신청 금액  : ${(r.amount_requested||0).toLocaleString()}원
   ▸ 지급 예정  : ${(r.amount_payable||0).toLocaleString()}원  (규정 한도 적용)

3. 판정 결과
   ▸ 자동 판정  : ${r.rule_status}
   ▸ 주요 플래그 : ${flags.join(", ")||"없음"}${fNote}

4. 처리 의견
   회사 DB 대조 및 규정 자동 검토를 완료하였기에 결재 요청합니다.

─────────────────────────────────────────────────────
담당자: ______________  팀장: ______________  본부장: ______________
─────────────────────────────────────────────────────`;
}

async function openBatchDraft() {
  const candidates = allData.filter(r => r.rule_status === "자동승인후보");
  if (!candidates.length) { alert("자동승인후보 건이 없습니다."); return; }

  document.getElementById("batch-modal").classList.add("open");
  document.getElementById("download-all-btn").style.display = "none";
  document.getElementById("batch-modal-body").innerHTML =
    `<div class="draft-progress">⏳ ${candidates.length}건의 기안문을 생성하고 있습니다…</div>`;
  batchDrafts = [];

  let usedApi = false;
  if (isLive) {
    try {
      const ids = candidates.map(r => r.id);
      const res = await fetch(_INBOX_ORIG + "/api/tuition/admin/batch-draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ app_ids: ids }),
        signal: AbortSignal.timeout(15000)
      });
      if (res.ok) { const j = await res.json(); batchDrafts = j.drafts || []; usedApi = true; }
    } catch (e) { console.warn("배치 기안문 API 오류:", e); }
  }

  if (!usedApi) {
    batchDrafts = candidates.map(r => ({
      id: r.id, employee_name: r.employee_name, child_name: r.child_name,
      verdict: r.rule_status, draft_text: _buildDraftLocal(r)
    }));
  }

  const body = document.getElementById("batch-modal-body");
  body.innerHTML = batchDrafts.map((d, i) => `
    <div class="draft-item">
      <div class="draft-item-header" onclick="toggleDraftItem(${i})">
        <span>📄 ${d.id} · ${d.employee_name} · ${d.child_name}</span>
        <span id="di-toggle-${i}" style="font-size:11px;color:var(--blue-mid)">▼ 펼치기</span>
      </div>
      <div class="draft-item-body" id="di-body-${i}">${escHtml(d.draft_text)}</div>
    </div>
  `).join("");
  document.getElementById("download-all-btn").style.display = "";
}

function toggleDraftItem(i) {
  const el = document.getElementById("di-body-" + i);
  const tg = document.getElementById("di-toggle-" + i);
  tg.textContent = el.classList.toggle("open") ? "▲ 접기" : "▼ 펼치기";
}
function closeBatchModal() { document.getElementById("batch-modal").classList.remove("open"); }
function downloadAllDrafts() {
  if (!batchDrafts.length) return;
  const combined = batchDrafts.map(d =>
    `${"=".repeat(60)}\n${d.id}  ${d.employee_name}  ${d.child_name}\n${"=".repeat(60)}\n\n${d.draft_text}\n\n`
  ).join("\n");
  const fname = `자동승인후보_기안문_일괄_${new Date().toISOString().slice(0,10)}.txt`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + combined], { type: "text/plain;charset=utf-8" }));
  a.download = fname; a.click();
}
function escHtml(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function updateBatchCount() {
  const cnt = allData.filter(r => r.rule_status === "자동승인후보").length;
  const el = document.getElementById("batch-draft-count");
  if (el) el.textContent = `(자동승인후보 ${cnt}건)`;
}

// ─── 초기 로드 ───────────────────────────────────────────────────────────────
loadData();
</script>
