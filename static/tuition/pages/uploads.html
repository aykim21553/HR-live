<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>첨부파일 보관함 · HR Room</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
:root{--org:#FF6900;--org-dk:#a14000;--pale:#fff8f4;--low:#f3f4f5;--bd:rgba(25,28,29,0.08);--tx:#1B1B1F;--mu:#49454E;--so:#7A757F;--gn:#0d6b47;--gnb:rgba(13,107,71,0.09);--am:#a16400;--amb:rgba(201,120,0,0.09);--rd:#9b1b1b;--rdb:rgba(186,26,26,0.08);--vi:#625B71;--vib:rgba(98,91,113,0.09);--sh:0 6px 22px rgba(25,28,29,0.07);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--tx);background:var(--low);}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;}
.tb{background:rgba(255,255,255,0.93);backdrop-filter:blur(12px);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200;box-shadow:0 1px 0 var(--bd);}
.tb-brand{font-size:14px;font-weight:800;color:var(--org);}
.tb-r{display:flex;align-items:center;gap:10px;}
.abtn{font-size:12px;font-weight:600;color:var(--mu);text-decoration:none;padding:5px 12px;border-radius:20px;border:1px solid var(--bd);background:#fff;}
.abtn:hover{background:var(--pale);color:var(--org);}

.wrap{max-width:1240px;margin:0 auto;padding:24px 22px;}
h1{font-size:22px;font-weight:800;margin-bottom:4px;}
.lead{font-size:13px;color:var(--so);margin-bottom:18px;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;}}
.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);}
.stat-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--so);margin-bottom:6px;}
.stat-v{font-size:22px;font-weight:800;color:var(--tx);}
.stat-v.org{color:var(--org);}
.stat-v.gn{color:var(--gn);}
.stat-v.am{color:var(--am);}

.toolbar{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh);}
.toolbar input[type="text"]{flex:1;min-width:220px;background:var(--low);border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;color:var(--tx);outline:none;}
.toolbar input[type="text"]:focus{box-shadow:0 0 0 2px rgba(255,105,0,0.3);}
.toolbar select{background:var(--low);border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;color:var(--tx);outline:none;cursor:pointer;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-p{background:linear-gradient(135deg,var(--org-dk),var(--org));color:#fff;box-shadow:0 4px 12px rgba(255,105,0,0.22);}
.btn-g{background:#fff;color:var(--mu);border:1.5px solid var(--bd);}
.btn-g:hover{background:var(--low);}
.btn-rd{background:#fff;color:var(--rd);border:1.5px solid rgba(186,26,26,0.3);}
.btn-rd:hover{background:var(--rdb);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .15s, box-shadow .15s;}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(25,28,29,0.1);}
.thumb{height:160px;background:#f8f8f8;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--bd);position:relative;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb .placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--so);}
.thumb .placeholder .material-symbols-outlined{font-size:48px;color:var(--so);}
.thumb .placeholder .ext{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--low);padding:3px 10px;border-radius:99px;}
.thumb .pdf-marker{position:absolute;top:8px;left:8px;background:#9b1b1b;color:#fff;font-size:9px;font-weight:800;padding:3px 8px;border-radius:4px;letter-spacing:.07em;}
.body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:5px;}
.fname{font-size:13px;font-weight:800;color:var(--tx);word-break:break-all;line-height:1.35;}
.meta{font-size:11px;color:var(--so);display:flex;gap:8px;flex-wrap:wrap;}
.meta .m{display:inline-flex;align-items:center;gap:3px;}
.linked-pill{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;}
.linked-pill.linked{background:var(--gnb);color:var(--gn);}
.linked-pill.orphan{background:var(--amb);color:var(--am);}
.actions{display:flex;gap:5px;padding:10px 14px;border-top:1px solid var(--bd);background:var(--low);}
.actions .ab{flex:1;font-size:11px;font-weight:700;padding:6px 8px;border-radius:8px;background:#fff;border:1px solid var(--bd);color:var(--mu);cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:3px;}
.actions .ab:hover{background:var(--pale);color:var(--org);border-color:var(--org);}
.actions .ab.danger{color:var(--rd);}
.actions .ab.danger:hover{background:var(--rdb);border-color:var(--rd);}

.empty{padding:50px 30px;text-align:center;background:#fff;border:1px dashed var(--bd);border-radius:14px;}
.empty .ic{font-size:48px;color:var(--so);margin-bottom:8px;}
.empty .lbl{font-size:14px;font-weight:700;color:var(--mu);margin-bottom:4px;}
.empty .sub{font-size:12px;color:var(--so);}

/* 모달 */
.fv-modal{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;}
.fv-modal.open{display:flex;}
.fv-modal-inner{background:#fff;border-radius:14px;width:92vw;max-width:1080px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.fv-modal-hdr{padding:12px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.fv-modal-hdr .ttl{font-size:13px;font-weight:700;color:var(--tx);}
.fv-modal-content{padding:0;flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#222;}
.fv-modal-content img{max-width:100%;height:auto;}
.fv-modal-content iframe{width:100%;height:100%;min-height:75vh;border:none;}
.fv-modal-close{width:30px;height:30px;border-radius:50%;background:var(--low);border:none;cursor:pointer;font-size:16px;color:var(--mu);}
.fv-modal-close:hover{background:var(--rdb);color:var(--rd);}
</style>
</head>
<body>

<header class="tb">
  <span class="tb-brand">📂 첨부파일 보관함 · HR Room</span>
  <div class="tb-r">
    <a class="abtn" href="inbox.html">← 신청 인박스</a>
    <a class="abtn" href="apply.html">+ 신규 신청</a>
  </div>
</header>

<div class="wrap">
  <h1>첨부파일 보관함</h1>
  <p class="lead">학자금 신청 시 업로드된 모든 OCR 원본 파일이 디스크에 영속 저장됩니다. 신청건과 연결된 파일과 미연결(고아) 파일을 한 화면에서 미리보기·다운로드할 수 있습니다.</p>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-l">전체 파일</div><div class="stat-v" id="s-total">—</div></div>
    <div class="stat"><div class="stat-l">신청 연결</div><div class="stat-v gn" id="s-linked">—</div></div>
    <div class="stat"><div class="stat-l">미연결</div><div class="stat-v am" id="s-orphan">—</div></div>
    <div class="stat"><div class="stat-l">총 용량</div><div class="stat-v" id="s-size">—</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="q" placeholder="🔍 파일명·신청번호·사번 검색" oninput="render()">
    <select id="filter" onchange="render()">
      <option value="all">전체 보기</option>
      <option value="linked">신청 연결만</option>
      <option value="orphan">미연결만</option>
    </select>
    <select id="sort" onchange="render()">
      <option value="date_desc">최신순</option>
      <option value="date_asc">오래된순</option>
      <option value="size_desc">용량순</option>
      <option value="name_asc">이름순</option>
    </select>
    <button class="btn btn-g" onclick="loadAll()">🔄 새로고침</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="ic">📭</div>
    <div class="lbl">조건에 맞는 파일이 없습니다</div>
    <div class="sub">학자금 신청 시 OCR 업로드한 파일이 여기에 자동으로 모입니다.</div>
  </div>
</div>

<div class="fv-modal" id="fv-modal" onclick="if(event.target===this)closeModal()">
  <div class="fv-modal-inner">
    <div class="fv-modal-hdr">
      <span class="ttl" id="m-ttl">첨부 파일</span>
      <button class="fv-modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="fv-modal-content" id="m-content"></div>
  </div>
</div>

<script>
const _API_ORIGIN = (location.hostname==='127.0.0.1'||location.hostname==='localhost')
  ? 'http://127.0.0.1:8765' : '';
const UPLOADS_API = _API_ORIGIN + '/api/tuition/admin/uploads';

let _items = [];

async function loadAll(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div style="padding:30px;text-align:center;color:var(--so);font-size:13px">📡 보관함 데이터를 불러오는 중…</div>';
  try{
    const r = await fetch(UPLOADS_API, {signal: AbortSignal.timeout(10000)});
    if(!r.ok){ throw new Error('HTTP '+r.status); }
    const j = await r.json();
    _items = j.items || [];
    document.getElementById('s-total').textContent  = (j.total||0).toLocaleString();
    document.getElementById('s-linked').textContent = (j.linked||0).toLocaleString();
    document.getElementById('s-orphan').textContent = (j.orphan||0).toLocaleString();
    const totalSize = _items.reduce((s,x)=>s+(x.size||0),0);
    document.getElementById('s-size').textContent = fmtSize(totalSize);
    render();
  }catch(e){
    grid.innerHTML = `<div style="padding:30px;text-align:center;color:var(--rd);font-size:13px">❌ 서버 연결 실패: ${esc(e.message||'')}<br><span style="font-size:11px;color:var(--so)">서버가 실행 중인지 확인하세요. (uvicorn server:app --port 8765)</span></div>`;
  }
}

function render(){
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  const flt = document.getElementById('filter').value;
  const sort = document.getElementById('sort').value;
  let arr = _items.slice();

  if(flt==='linked')  arr = arr.filter(x=>x.linked_app_id);
  if(flt==='orphan')  arr = arr.filter(x=>!x.linked_app_id);
  if(q){
    arr = arr.filter(x=>{
      const hay = [x.filename, x.linked_app_id, x.employee_id, x.token].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(sort==='date_desc') arr.sort((a,b)=>(b.uploaded_at||'').localeCompare(a.uploaded_at||''));
  if(sort==='date_asc')  arr.sort((a,b)=>(a.uploaded_at||'').localeCompare(b.uploaded_at||''));
  if(sort==='size_desc') arr.sort((a,b)=>(b.size||0)-(a.size||0));
  if(sort==='name_asc')  arr.sort((a,b)=>(a.filename||'').localeCompare(b.filename||''));

  const grid = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  if(!arr.length){
    grid.innerHTML = '';
    emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';
  grid.innerHTML = arr.map(it => cardHtml(it)).join('');
}

function cardHtml(it){
  const ext = (it.ext||'bin').toLowerCase();
  const isImg = ['png','jpg','jpeg','gif','webp'].includes(ext);
  const isPdf = ext==='pdf';
  const url   = `${UPLOADS_API}/${encodeURIComponent(it.token)}`;
  const thumb = isImg
    ? `<img src="${url}" alt="${esc(it.filename)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',innerHTML:'<span class=&quot;material-symbols-outlined&quot;>broken_image</span><span class=&quot;ext&quot;>${esc(ext)}</span>'}))">`
    : `<div class="placeholder"><span class="material-symbols-outlined">${isPdf?'picture_as_pdf':'description'}</span><span class="ext">${esc(ext)}</span></div>`;
  const linkBadge = it.linked_app_id
    ? `<span class="linked-pill linked">✓ 연결</span>`
    : `<span class="linked-pill orphan">미연결</span>`;
  const linkRow = it.linked_app_id
    ? `<div class="meta"><span class="m">📋 <a href="admin_review.html?id=${encodeURIComponent(it.linked_app_id)}" style="color:var(--org);font-weight:700;text-decoration:none">${esc(it.linked_app_id)}</a></span></div>`
    : '';
  const empRow = it.employee_id
    ? `<div class="meta"><span class="m">👤 ${esc(it.employee_id)}</span></div>`
    : '';
  return `
    <div class="card">
      <div class="thumb" onclick="openModal('${esc(it.token)}', '${esc(it.filename)}', '${ext}')">
        ${isPdf?'<div class="pdf-marker">PDF</div>':''}
        ${thumb}
      </div>
      <div class="body">
        <div class="fname">${esc(it.filename||'(no name)')}</div>
        <div class="meta">
          <span class="m">${linkBadge}</span>
          <span class="m">📅 ${fmtDate(it.uploaded_at)}</span>
          <span class="m">📦 ${fmtSize(it.size||0)}</span>
        </div>
        ${linkRow}
        ${empRow}
      </div>
      <div class="actions">
        <a class="ab" href="${url}" target="_blank">🔍 새 탭</a>
        <a class="ab" href="${url}" download="${esc(it.filename||it.token)}">⬇ 다운로드</a>
        <button class="ab danger" onclick="delUpload('${esc(it.token)}', '${esc(it.filename||'')}')">🗑 삭제</button>
      </div>
    </div>`;
}

function openModal(token, filename, ext){
  const url = `${UPLOADS_API}/${encodeURIComponent(token)}`;
  document.getElementById('m-ttl').textContent = filename || '첨부 파일';
  const content = document.getElementById('m-content');
  if(ext==='pdf'){
    content.innerHTML = `<iframe src="${url}"></iframe>`;
  } else {
    content.innerHTML = `<img src="${url}" alt="${esc(filename)}">`;
  }
  document.getElementById('fv-modal').classList.add('open');
}

function closeModal(){ document.getElementById('fv-modal').classList.remove('open'); }

async function delUpload(token, filename){
  if(!confirm(`이 첨부파일을 보관함에서 영구 삭제할까요?\n\n${filename||token}\n\n※ 신청 레코드는 유지되지만 파일 미리보기가 불가해집니다.`)) return;
  try{
    const r = await fetch(`${UPLOADS_API}/${encodeURIComponent(token)}`, {method:'DELETE'});
    if(r.ok){ loadAll(); }
    else{ alert('삭제 실패: HTTP '+r.status); }
  }catch(e){ alert('삭제 실패: '+e.message); }
}

function fmtSize(n){
  if(!n) return '0 B';
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}
function fmtDate(s){
  if(!s) return '—';
  try{
    const d = new Date(s);
    if(isNaN(d.getTime())) return s.slice(0,16);
    const yy = d.getFullYear(), mm = String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
    return `${yy}-${mm}-${dd} ${hh}:${mi}`;
  }catch{ return s.slice(0,16); }
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

loadAll();
</script>
</body>
</html>
