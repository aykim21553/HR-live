<title>학자금 관리자 — 신청 상세</title>
<style>
  :root {
    --blue: #1F4E79; --blue-mid: #2E75B6; --blue-light: #DEEBF7; --blue-pale: #EBF3FF;
    --green: #375623; --green-light: #E2EFDA; --green-badge: #1a7a3c;
    --amber: #7F6000; --amber-light: #FFF2CC; --amber-badge: #b45309;
    --orange: #843C0C; --orange-light: #FCE4D6;
    --red: #C00000; --red-light: #FFDDE0; --red-badge: #991b1b;
    --gray: #595959; --gray-light: #F5F5F5; --border: #D9D9D9;
    --text: #1F1F1F; --text-muted: #595959;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 14px; color: var(--text); background: #F0F2F5; }

  /* ── 헤더 ── */
  .topbar { background: var(--blue); color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .topbar .back { cursor: pointer; opacity: .8; font-size: 13px; }
  .topbar .back:hover { opacity: 1; }
  .api-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: auto; }
  .api-live { background: #1a7a3c; color: #fff; }
  .api-demo { background: #b45309; color: #fff; }

  /* ── 레이아웃 ── */
  .page { max-width: 1200px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 16px; }

  /* ── 요약 카드 ── */
  .summary-card { background: #fff; border-radius: 10px; border: 1px solid var(--border); padding: 20px 24px; }
  .summary-card .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .summary-card .field { min-width: 130px; }
  .summary-card .label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .summary-card .value { font-size: 16px; font-weight: 600; color: var(--text); }
  .summary-card .amount-payable { color: var(--blue-mid); font-size: 20px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-green  { background: var(--green-light);  color: var(--green-badge); }
  .badge-amber  { background: var(--amber-light);  color: var(--amber-badge); }
  .badge-orange { background: var(--orange-light); color: var(--orange); }
  .badge-red    { background: var(--red-light);    color: var(--red-badge); }
  .badge-gray   { background: var(--gray-light);   color: var(--gray); }

  /* ── 3컬럼 그리드 ── */
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }

  /* ── 패널 ── */
  .panel { background: #fff; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--blue-pale); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .panel-header h3 { font-size: 13px; font-weight: 700; color: var(--blue); }
  .panel-body { padding: 16px; }

  /* ── 룰 체크 ── */
  .rule-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--gray-light); }
  .rule-item:last-child { border-bottom: none; }
  .rule-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
  .rule-ok   { background: var(--green-light); color: var(--green-badge); }
  .rule-fail { background: var(--red-light);   color: var(--red-badge); }
  .rule-warn { background: var(--amber-light); color: var(--amber-badge); }
  .rule-name { font-size: 12px; font-weight: 600; }
  .rule-reason { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ── RAG 패널 ── */
  .provision { background: var(--blue-pale); border-left: 3px solid var(--blue-mid); padding: 8px 10px; border-radius: 0 6px 6px 0; margin-bottom: 8px; font-size: 12px; line-height: 1.6; }
  .case-item { background: var(--gray-light); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; line-height: 1.5; }
  .case-item .case-status { font-size: 11px; font-weight: 600; margin-bottom: 2px; }

  /* ── 이력 테이블 ── */
  .hist-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .hist-table th { background: var(--blue-pale); padding: 7px 10px; text-align: left; font-weight: 600; color: var(--blue); border-bottom: 1px solid var(--border); }
  .hist-table td { padding: 7px 10px; border-bottom: 1px solid var(--gray-light); }
  .hist-table tr:last-child td { border-bottom: none; }

  /* ── 검토의견 ── */
  .comment-box { background: var(--gray-light); border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.7; white-space: pre-line; }

  /* ── 첨부 뷰어 ── */
  .doc-viewer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .doc-preview { background: var(--gray-light); border-radius: 8px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; padding: 12px; font-size: 12px; }
  .doc-extracted { font-size: 12px; }
  .doc-extracted dt { color: var(--text-muted); margin-top: 6px; }
  .doc-extracted dd { font-weight: 600; }

  /* ── 액션 바 ── */
  .action-bar { background: #fff; border-radius: 10px; border: 1px solid var(--border); padding: 16px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .action-bar .label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-right: 8px; }
  .btn { padding: 9px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-approve  { background: var(--green-badge); color: #fff; }
  .btn-partial  { background: var(--blue-mid);    color: #fff; }
  .btn-supplement { background: var(--amber-badge); color: #fff; }
  .btn-reject   { background: var(--red-badge);   color: #fff; }
  .btn-secondary { background: var(--gray-light); color: var(--text); border: 1px solid var(--border); }

  /* ── 처리 완료 배너 ── */
  .done-banner { border-radius: 8px; padding: 14px 18px; font-size: 14px; font-weight: 600; display: none; }
  .done-banner.approved    { background: var(--green-light); color: var(--green-badge); }
  .done-banner.partial     { background: var(--blue-pale);   color: var(--blue-mid); }
  .done-banner.supplement  { background: var(--amber-light); color: var(--amber-badge); }
  .done-banner.rejected    { background: var(--red-light);   color: var(--red-badge); }

  /* ── 토스트 ── */
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1F1F1F; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9999; }
  .toast.show { opacity: 1; }

  .flag-chip { display: inline-block; background: var(--orange-light); color: var(--orange); font-size: 11px; padding: 2px 8px; border-radius: 10px; margin: 2px; font-weight: 600; }
  .loading-state { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }
</style>

let appData = null;

async function loadApp() {
  let data = null;
  let isLive = false;

  try {
    const res = await fetch(`${API_BASE}/tuition/applications/${APP_ID}`, {
      signal: AbortSignal.timeout(4000)
    });
    if (res.ok) {
      data = await res.json();
      isLive = true;
    }
  } catch (e) {
    console.warn('API 연결 실패, 샘플 데이터 사용');
  }

  // API 실패 시 SAMPLE 폴백
  if (!data) {
    data = SAMPLE_APPS[APP_ID] || { ...DEFAULT_SAMPLE, id: APP_ID };
  }

  appData = data;

  document.getElementById("api-badge").textContent = isLive ? "LIVE" : "DEMO";
  document.getElementById("api-badge").className = `api-badge ${isLive ? "api-live" : "api-demo"}`;

  render(data);
}

// ─── 룰 체크 렌더 ─────────────────────────────────────────────────────────────
const RULE_NAMES = {
  "자격":"자격 확인", "학교급":"학교급 확인", "납부일":"납부일 기준",
  "중복":"중복 신청", "누적한도":"누적 한도", "회당한도":"회당 한도", "서류정합":"서류 정합성"
};

function renderRuleChecks(checks) {
  if (!Object.keys(checks).length) {
    return `<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px;">판정 결과 없음</div>`;
  }
  return Object.entries(checks).map(([key, chk]) => {
    const icon = chk.passed === true ? "✓" : chk.passed === false ? "✗" : "?";
    const cls  = chk.passed === true ? "rule-ok" : chk.passed === false ? "rule-fail" : "rule-warn";
    return `<div class="rule-item">
      <div class="rule-icon ${cls}">${icon}</div>
      <div>
        <div class="rule-name">${RULE_NAMES[key] || key}</div>
        <div class="rule-reason">${chk.reason || ""}</div>
      </div>
    </div>`;
  }).join("");
}

// ─── RAG 패널 렌더 (API 기반 동적) ──────────────────────────────────────────

const OUTCOME_CLS = {
  "자동승인": "var(--green-badge)", "일부승인": "var(--blue-mid)",
  "보완필요": "var(--amber-badge)", "보완": "var(--amber-badge)",
  "수기검토필요": "var(--orange)", "수기검토": "var(--orange)",
  "반려": "var(--red-badge)"
};
const OUTCOME_ICON = {
  "자동승인":"✓", "일부승인":"△", "보완필요":"△", "보완":"△",
  "수기검토필요":"⚠", "수기검토":"⚠", "반려":"✗"
};

function renderRagPanelFromData(ragData) {
  const provisions = ragData.provisions || [];
  const cases      = ragData.cases      || [];
  const faq        = ragData.faq        || [];

  let html = "";

  // 규정 조항
  html += `<div style="font-size:11px;font-weight:700;color:var(--blue);margin-bottom:8px;">📋 적용 규정 조항</div>`;
  if (provisions.length) {
    html += provisions.map(p => `
      <div class="provision">
        <div style="font-size:10px;color:var(--blue-mid);font-weight:700;margin-bottom:2px;">${p.title || ""}</div>
        ${p.text}
      </div>`).join("");
  } else {
    html += `<div class="provision" style="color:var(--text-muted)">관련 규정 조항을 찾지 못했습니다.</div>`;
  }

  // 유사 사례
  html += `<div style="font-size:11px;font-weight:700;color:var(--blue);margin:12px 0 8px;">📂 유사 처리 사례</div>`;
  if (cases.length) {
    html += cases.map(c => {
      const color = OUTCOME_CLS[c.outcome] || "var(--gray)";
      const icon  = OUTCOME_ICON[c.outcome] || "·";
      return `<div class="case-item">
        <div class="case-status" style="color:${color}">${icon} ${c.title || c.outcome}</div>
        ${c.summary}
      </div>`;
    }).join("");
  } else {
    html += `<div class="case-item" style="color:var(--text-muted)">유사 사례 없음</div>`;
  }

  // FAQ
  if (faq.length) {
    html += `<div style="font-size:11px;font-weight:700;color:var(--blue);margin:12px 0 8px;">❓ 자주 묻는 질문</div>`;
    html += faq.map(f => `
      <div style="background:var(--blue-pale);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;">
        <div style="font-weight:700;color:var(--blue);margin-bottom:4px;">Q. ${f.question}</div>
        <div style="color:var(--text);line-height:1.5;">A. ${f.answer}</div>
      </div>`).join("");
  }

  return html;
}

// API에서 RAG 데이터 fetch 후 패널 업데이트
async function loadRagPanel(d) {
  const panel  = document.getElementById("rag-panel-body");
  const label  = document.getElementById("rag-source-label");
  if (!panel) return;

  // 1순위: 신청 데이터에 rag_context 이미 포함된 경우 (evaluate 실행 후)
  const stored = d.rule_result?.rag_context;
  if (stored && (stored.provisions?.length || stored.cases?.length)) {
    panel.innerHTML = renderRagPanelFromData(stored);
    if (label) { label.textContent = "저장된 RAG"; }
    return;
  }

  // 2순위: RAG API 직접 호출
  try {
    const rule = d.rule_result || {};
    const flags = (rule.flags || []).join(",");
    const qs = new URLSearchParams({
      school_type: d.school_type || "",
      eval_status: rule.status   || "",
      flags,
      reason:      rule.reason   || "",
    });
    const res = await fetch(`${API_BASE}/tuition/rag?${qs}`, { signal: AbortSignal.timeout(4000) });
    if (res.ok) {
      const data = await res.json();
      panel.innerHTML = renderRagPanelFromData(data);
      if (label) { label.textContent = "LIVE RAG"; label.style.color = "var(--green-badge)"; }
      return;
    }
  } catch (e) {
    console.warn("RAG API 호출 실패, 정적 데이터 사용");
  }

  // 3순위: 정적 폴백
  panel.innerHTML = renderRagPanelFromData(buildStaticRag(d));
  if (label) { label.textContent = "정적 데이터"; }
}

    "고등학교": [
      {title:"고등학교 지원 한도",text:"분기당 100만원(입학금 포함). 최대 3년(12분기)."},
      {title:"지원 항목",text:"입학금·수업료·학교운영지원비·육성회비·기성회비."},
      {title:"제외 항목",text:"급식비·교재비·학생회비·기숙사비는 지원 제외."},
    ],
    "대학교": [
      {title:"대학교 지원 한도",text:"학기당 320만원(입학금 제외). 최대 4년(8학기)."},
      {title:"장학금 차감",text:"장학금·정부보조금 수령 시 실납입액 기준으로 지원."},
      {title:"지원 범위",text:"정규교과과정 수업료만 해당. 기숙사비·급식비 제외."},
    ],
  };

  const STATIC_CASES = {
    "자동승인후보": [{outcome:"자동승인",title:"정상 승인 사례",summary:"한도 이내 정상 신청, 서류 일치 → 자동 승인 처리."}],
    "보완필요":     [{outcome:"보완",    title:"보완요청 사례",summary:"서류 불일치 또는 납부일 미확인 → 직원 재제출 안내 후 재심사."}],
    "수기검토필요": [{outcome:"수기검토필요",title:"수기검토 사례",summary:"중복 의심 또는 서류 인식 불가 → 관리자 수동 확인 후 처리."}],
    "반려":         [{outcome:"반려",    title:"반려 사례",summary:"누적 한도 소진 또는 자격 미달 → 규정에 따라 지원 불가."}],
  };

  return {
    provisions: STATIC_PROVISIONS[school] || [],
    cases:      STATIC_CASES[status]      || [],
    faq:        [],
  };
}

// 재검색 버튼
async function refreshRag() {
  const panel = document.getElementById("rag-panel-body");
  const label = document.getElementById("rag-source-label");
  if (panel) panel.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-muted);">재검색 중...</div>`;
  if (label) label.textContent = "로딩 중...";
  if (appData) await loadRagPanel(appData);
}

// ─── 자녀 이력 테이블 렌더 ───────────────────────────────────────────────────
function renderHistory(records, hist) {
  if (!records.length) {
    return `<div style="padding:20px;text-align:center;font-size:13px;color:var(--text-muted);">지급 이력 없음</div>`;
  }
  const rows = records.map(r =>
    `<tr><td>${r.term}</td><td>${fmtAmt(r.amount_paid)}</td><td>${r.approved_date || "—"}</td></tr>`
  ).join("");
  const total = hist.total_amount_paid || 0;
  return `
    <table class="hist-table">
      <thead><tr><th>기간</th><th>지급금액</th><th>처리일</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="padding:10px 12px;font-size:11px;color:var(--text-muted);">
      누적 지급총액: <strong>${total.toLocaleString()}원</strong>
    </div>
  `;
}

// ─── 기안문 빌더 ─────────────────────────────────────────────────────────────
function buildDraft(d) {
  const unit = d.school_type === "대학교" ? "학기" : "분기";
  const year = d.benefit_year || new Date().getFullYear();
  return `수신: 재무팀장
발신: 인사팀
제목: ${year}년 ${d.benefit_term?.replace(year+"-","")} 자녀 학자금 지원금 지급 요청

아래와 같이 자녀 학자금 지원금 지급을 요청드립니다.

■ 신청자: ${d.employee_name} (${d.employee_id || ""})
■ 수혜 자녀: ${d.child_name} (${d.school_type})
■ 지원 기간: ${d.benefit_term}
■ 지급 금액: ${fmtAmt(d.amount_payable)}
■ 지급 계좌: 급여 계좌 동일 적용

상기 금액은 사내 학자금 지원 규정 및 자동 심사 결과에 따라 지급가능금액으로 산정되었습니다.

인사팀 드림`;
}

// ─── 관리자 액션 ─────────────────────────────────────────────────────────────
function showPartialModal(defaultAmt) {
  document.getElementById("partial-amount").value = defaultAmt || 0;
  document.getElementById("partial-modal").style.display = "flex";
}
function closeModal() {
  document.getElementById("partial-modal").style.display = "none";
}

async function handleAction(action) {
  closeModal();
  const statusMap = {
    approve: "approved", partial_approve: "partial_approved",
    supplement: "supplement_requested", reject: "rejected"
  };
  const messages = {
    approve: "✔ 승인 처리되었습니다.",
    partial_approve: `✔ 일부승인 처리되었습니다. (${Number(document.getElementById("partial-amount")?.value||0).toLocaleString()}원)`,
    supplement: "✔ 보완 요청 문안이 발송되었습니다.",
    reject: "✔ 반려 처리되었습니다."
  };

  try {
    const body = { status: statusMap[action], comment: `관리자 ${action} 처리` };
    if (action === "partial_approve") {
      body.final_amount = Number(document.getElementById("partial-amount")?.value || 0);
    }

    const res = await fetch(`${API_BASE}/tuition/applications/${APP_ID}/status`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: AbortSignal.timeout(4000)
    });

    if (res.ok) {
      appData.status = statusMap[action];
      if (action === "partial_approve" && body.final_amount) {
        appData.amount_payable = body.final_amount;
      }
      showToast(messages[action]);
      setTimeout(() => render(appData), 300);
    } else {
      showToast("API 처리 중 오류 (DEMO 모드: 화면에서만 반영)");
      appData.status = statusMap[action];
      setTimeout(() => render(appData), 300);
    }
  } catch (e) {
    // API 미연결 시 화면만 업데이트
    showToast(messages[action] + " (DEMO)");
    appData.status = statusMap[action];
    setTimeout(() => render(appData), 300);
  }
}

function exportDraft() {
  if (!appData) return;
  const text = buildDraft(appData);
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `기안문_${APP_ID}.txt`;
  a.click(); URL.revokeObjectURL(url);
}

// ─── 헬퍼 ────────────────────────────────────────────────────────────────────
function fmtAmt(n) { return n > 0 ? n.toLocaleString() + "원" : "—"; }

function badgeCls(status) {
  return {
    "자동승인후보":"badge-green", "보완필요":"badge-amber",
    "수기검토필요":"badge-orange", "반려":"badge-red"
  }[status] || "badge-gray";
}

function statusToCls(s) {
  return {approved:"approved",partial_approved:"partial",supplement_requested:"supplement",rejected:"rejected"}[s] || "";
}
function statusToLabel(s) {
  return {approved:"승인",partial_approved:"일부승인",supplement_requested:"보완요청",rejected:"반려"}[s] || s;
}

function showToast(msg, duration=2800) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), duration);
}

// ─── 시작 ─────────────────────────────────────────────────────────────────────
loadApp();
</script>
